<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Omnia Now</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--bg:#07060f;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#f5f3ff;--mute:#9a94b8;--a:#8b5cf6;--b:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(600px 400px at 10% -10%,rgba(139,92,246,.35),transparent),radial-gradient(500px 400px at 100% 110%,rgba(34,211,238,.22),transparent),var(--bg)}
.hide{display:none!important}
.logo{font-weight:800;letter-spacing:1px;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#setup{padding:calc(env(safe-area-inset-top) + 56px) 24px 24px;max-width:480px;margin:auto}
h1{font-size:34px;margin:26px 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:14px;font-size:16px;margin-top:12px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--b)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:#fff;margin-top:12px;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}
.btn.g{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.err{color:#fb7185;margin-top:14px;font-size:14px}
label.ck{display:flex;gap:12px;align-items:center;margin-top:8px}
label.ck input{width:24px;height:24px;margin:0;accent-color:var(--a)}
#app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:600;font-size:14px}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;padding:0 16px 12px;overflow-y:auto}
.pane.on{display:flex}
nav{display:flex;background:#0e0b1e;border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;opacity:.5}
nav button.on{color:var(--b)}nav button.on span{opacity:1}
.msgs{flex:1;overflow-y:auto;padding:4px 0}
.b{max-width:86%;padding:12px 14px;border-radius:18px;margin:0 0 10px;border:1px solid var(--line);white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.b.me{margin-left:auto;background:rgba(139,92,246,.35)}.b.ai{background:var(--card)}
.bar{display:flex;gap:10px;align-items:center;padding-top:8px}
.bar input{margin:0}
.send{width:48px;height:48px;border-radius:50%;border:0;color:#fff;font-size:18px;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
iframe{width:100%;flex:1;min-height:320px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:14px}
.out{width:100%;border-radius:16px;margin-top:16px;border:1px solid var(--line);background:var(--card)}
.note{color:var(--mute);font-size:14px;margin-top:10px}
</style></head><body>

<div id="setup" class="hide"></div>

<div id="app" class="hide">
  <div class="top"><div class="logo">omnia now</div>
    <div><a class="pill" href="https://discord.gg/nfuCjtThz" target="_blank" rel="noopener">Discord</a> <button class="pill" id="out">Logout</button></div></div>
  <main>
    <section class="pane on" id="p-chat"><div class="msgs" id="msgs"></div>
      <div class="bar"><input id="ci" placeholder="Message likho..."><button class="send" id="cs">&#10148;</button></div></section>
    <section class="pane" id="p-code"><textarea id="ti" rows="3" placeholder="Kaisi website/app banani hai? Jaise: todo app dark theme"></textarea>
      <button class="btn" id="tb">Generate</button><div class="note" id="tn"></div><iframe id="fr" class="hide" sandbox="allow-scripts"></iframe></section>
    <section class="pane" id="p-image"><textarea id="ii" rows="3" placeholder="Image describe karo..."></textarea>
      <button class="btn" id="ib">Generate image</button><div class="note" id="in"></div><img id="im" class="out hide" alt="generated"></section>
    <section class="pane" id="p-video"><textarea id="vi" rows="3" placeholder="Video describe karo..."></textarea>
      <button class="btn" id="vb">Generate video</button><div class="note" id="vn"></div><video id="vd" class="out hide" controls loop playsinline></video></section>
  </main>
  <nav><button data-t="chat" class="on"><span>&#128172;</span>Chat</button><button data-t="code"><span>&#9000;</span>Code</button><button data-t="image"><span>&#128444;</span>Image</button><button data-t="video"><span>&#127916;</span>Video</button></nav>
</div>

<script>
const GOOGLE_CLIENT_ID = ""; // optional: Google Cloud Console se Web Client ID daalo
const $ = (id) => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem("omnia_user")); } catch { return null; } };
const save = (u) => localStorage.setItem("omnia_user", JSON.stringify(u));
const users = () => { try { return JSON.parse(localStorage.getItem("omnia_users")) || {}; } catch { return {}; } };

// ---------- Setup ----------
const S = { mode: "signup", first: "", last: "", email: "", err: "" };
function view(step) {
  const el = $("setup"); el.classList.remove("hide"); $("app").classList.add("hide");
  const head = (t, s) => `<div class="logo">omnia now</div><h1>${t}</h1><p class="sub">${s}</p>`;
  const err = S.err ? `<div class="err">${S.err}</div>` : "";
  if (step === "choose") el.innerHTML = head("Welcome", "Ek baar setup, phir sab kuch ek app me.") +
    `<button class="btn" id="su">Sign up</button><button class="btn g" id="si">Sign in</button>`;
  if (step === "method") el.innerHTML = head(S.mode === "signup" ? "Sign up" : "Sign in", "Kaise continue karna hai?") +
    `<div id="gbtn" style="margin-top:12px"></div><button class="btn g" id="em">Apna khud ka (email)</button><button class="btn g" id="bk">Back</button>${err}`;
  if (step === "form") el.innerHTML = head(S.mode === "signup" ? "Apni details" : "Email daalo", "Koi code nahi, seedha continue.") +
    (S.mode === "signup" ? `<input id="f" placeholder="First name" value="${S.first}"><input id="l" placeholder="Last name" value="${S.last}">` : "") +
    `<input id="e" type="email" placeholder="Email" value="${S.email}"><button class="btn" id="go">Continue</button><button class="btn g" id="bk">Back</button>${err}`;
  if (step === "terms") el.innerHTML = head("Almost done", "Terms and Conditions accept karo.") +
    `<label class="ck"><input type="checkbox" id="t"><span>Main Terms and Conditions aur Privacy Policy se sahmat hu.</span></label><button class="btn" id="fin" disabled>All done</button>`;
  const on = (id, fn) => $(id) && ($(id).onclick = fn);
  on("su", () => { S.mode = "signup"; view("method"); });
  on("si", () => { S.mode = "signin"; view("method"); });
  on("bk", () => view(step === "form" ? "method" : "choose"));
  on("em", () => { S.err = ""; view("form"); });
  on("go", () => {
    S.err = ""; S.email = $("e").value.trim().toLowerCase();
    if (S.mode === "signup") { S.first = $("f").value.trim(); S.last = $("l").value.trim(); }
    if (!/^\S+@\S+\.\S+$/.test(S.email)) { S.err = "Sahi email daalo"; return view("form"); }
    if (S.mode === "signup") {
      if (!S.first || !S.last) { S.err = "Name aur last name daalo"; return view("form"); }
      S.pending = { first: S.first, last: S.last, email: S.email }; view("terms");
    } else {
      const u = users()[S.email];
      if (!u) { S.err = "Is email se account nahi mila. Pehle Sign up karo."; return view("form"); }
      save(u); start();
    }
  });
  if ($("t")) { $("t").onchange = () => ($("fin").disabled = !$("t").checked);
    on("fin", () => { const u = S.pending; const all = users(); all[u.email] = u; localStorage.setItem("omnia_users", JSON.stringify(all)); save(u); start(); }); }
  if ($("gbtn")) gbtn();
}
function gbtn() {
  const box = $("gbtn");
  if (!GOOGLE_CLIENT_ID) { box.innerHTML = `<button class="btn g" id="gx">Continue with Google</button>`;
    $("gx").onclick = () => { S.err = "Google ke liye index.html me GOOGLE_CLIENT_ID daalo. Tab tak email option use karo."; view("method"); }; return; }
  const init = () => { google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: (r) => {
      const p = JSON.parse(decodeURIComponent(escape(atob(r.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
      const u = { first: p.given_name || "", last: p.family_name || "", email: p.email };
      const all = users(); all[u.email] = u; localStorage.setItem("omnia_users", JSON.stringify(all));
      if (S.mode === "signup") { S.pending = u; view("terms"); } else { save(u); start(); } } });
    google.accounts.id.renderButton(box, { theme: "filled_black", size: "large", text: "continue_with", width: 300 }); };
  window.google ? init() : setTimeout(init, 1200);
}

// ---------- App ----------
async function api(path, body) {
  const r = await fetch("/api/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({ error: "Server error" }));
  if (!r.ok) throw new Error(d.error || "Error"); return d;
}
const hist = [];
const bubble = (t, who) => { const d = document.createElement("div"); d.className = "b " + who; d.textContent = t; $("msgs").appendChild(d); $("msgs").scrollTop = 1e9; return d; };
async function chat() {
  const t = $("ci").value.trim(); if (!t) return; $("ci").value = ""; bubble(t, "me"); hist.push({ role: "user", content: t });
  const w = bubble("...", "ai");
  try { const d = await api("chat", { messages: hist }); w.textContent = d.text; hist.push({ role: "assistant", content: d.text }); }
  catch (e) { w.textContent = "Error: " + e.message; hist.pop(); }
}
async function job(btn, note, fn) {
  btn.disabled = true; $(note).textContent = "Ban raha hai..."; try { await fn(); $(note).textContent = ""; } catch (e) { $(note).textContent = "Error: " + e.message; } btn.disabled = false;
}
function start() {
  $("setup").classList.add("hide"); $("app").classList.remove("hide");
  if (!$("msgs").children.length) bubble("Namaste " + (load()?.first || "") + "! Mai Omnia hu. Kuch bhi poocho.", "ai");
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button,.pane").forEach((x) => x.classList.remove("on")); b.classList.add("on"); $("p-" + b.dataset.t).classList.add("on"); });
$("cs").onclick = chat; $("ci").onkeydown = (e) => e.key === "Enter" && chat();
$("tb").onclick = () => job($("tb"), "tn", async () => { const d = await api("code", { prompt: $("ti").value }); $("fr").srcdoc = d.html; $("fr").classList.remove("hide"); });
$("ib").onclick = () => job($("ib"), "in", () => new Promise(async (ok, no) => { const d = await api("image", { prompt: $("ii").value }).catch(no); if (!d) return;
  $("im").onload = ok; $("im").onerror = () => no(new Error("Image load nahi hui")); $("im").src = d.image; $("im").classList.remove("hide"); }));
$("vb").onclick = () => job($("vb"), "vn", async () => { $("vn").textContent = "Free video AI slow hai, 1-2 minute lag sakte hai..."; const d = await api("video", { prompt: $("vi").value }); $("vd").src = d.video; $("vd").classList.remove("hide"); $("vd").play(); });
$("out").onclick = () => { localStorage.removeItem("omnia_user"); location.reload(); };
load() ? start() : view("choose");
</script></body></html>
